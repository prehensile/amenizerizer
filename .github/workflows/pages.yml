name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish, but only one deploy at a time. In-progress
# runs are left to finish so a half-uploaded artifact never goes live.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # reference/gb-amenizer-flask is documentation only; the build never
        # reads it, so don't pay for the submodule fetch.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # `npm run build` runs svelte-check first, so a type error fails the deploy.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
